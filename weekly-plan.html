<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Haftalık Plan</title>
  <style>
    :root{
      --text:#2C2C2B; --muted:#7D7A75; --bg:#FFFFFF; --surface:#F9F8F7; --surface2:#F0EFED;
      --border:#E6E5E3; --purple:#5B35F5; --purpleSoft:#EFEAFE; --green:#46A171; --greenSoft:#E8F1EC;
      --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 12px rgba(0,0,0,.04);
      --radius:12px;
      --colGap:14px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      color:var(--text);
      background:var(--bg);
    }
    .app{max-width:1540px; margin:0 auto; padding:10px 14px 32px;}

    .topbar{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:6px;}
    .brand h1{font-size:18px; line-height:1.25; margin:0; letter-spacing:.2px;}
    .brand p{margin:6px 0 0; color:var(--muted); font-size:13px;}

    .controls{display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:flex-end;}
    .btn{
      appearance:none; border:1px solid var(--border); background:var(--surface);
      color:var(--text);
      padding:10px 12px; border-radius:999px; font-weight:700; font-size:12px;
      cursor:pointer;
    }
    .btn.primary{background:var(--purpleSoft); border-color:#ddd1ff; color:#3717c8;}
    .btn:hover{filter:brightness(.98)}
    .btn:active{transform:translateY(1px)}

    .grid{
      display:grid;
      grid-template-columns: repeat(7, minmax(168px, 1fr));
      gap:var(--colGap);
      align-items:start;
    }

    .day{background:transparent; border-radius:14px; min-height:700px;}

    .dayHeader{
      text-align:center;
      padding:12px 8px 10px;
      border-bottom:1px solid var(--border);
      margin-bottom:10px;
    }
    .dow{font-size:16px; color:var(--text); font-weight:800; letter-spacing:.2px;}
    .totals{font-size:12px; color:var(--muted); margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

    .addTask{
      width:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      margin:0 0 10px;
      padding:11px 12px;
      border-radius:10px;
      border:0;
      background:#fff;
      cursor:pointer;
      color:#2c11c8;
      font-weight:800;
      font-size:15px;
    }
    .addTask:hover{background:var(--purpleSoft)}

    .cards{display:flex; flex-direction:column; gap:11px; padding:0 4px 10px;}

    .card{
      background:#F1F1F1;
      border:1px solid #eeeeee;
      border-radius:8px;
      padding:16px 12px;
      box-shadow:none;
      cursor:pointer;
      position:relative;
      min-height:94px;
    }
    .card:hover{box-shadow:var(--shadow); background:#fff}

    .cardTitle{text-align:center; font-weight:800; font-size:13px; line-height:1.25; margin:16px 20px 8px;}
    .cardMeta{text-align:center; font-size:13px; color:#6D6A66; font-weight:650; line-height:1.25;}
    .cardMinutes{margin-top:4px; font-size:11px; color:#8B8782; text-align:center;}

    .kebab{
      position:absolute; right:7px; top:5px;
      width:28px; height:28px;
      border-radius:8px;
      display:flex; align-items:center; justify-content:center;
      border:1px solid transparent;
      background:transparent;
      cursor:pointer;
      color:#111;
      font-size:18px;
      line-height:1;
    }
    .kebab:hover{border-color:var(--border); background:#fff}

    .check{
      position:absolute; left:10px; top:9px;
      width:28px; height:28px;
      border-radius:7px;
      border:1px solid var(--border);
      background:#fff;
      display:flex; align-items:center; justify-content:center;
      color:#fff;
      cursor:pointer;
      padding:0;
    }
    .check:hover{border-color:var(--green); background:var(--greenSoft)}
    .check:focus-visible{outline:3px solid rgba(70,161,113,.28); outline-offset:2px}
    .card.completed{background:var(--greenSoft); border-color:#cfe3d7;}
    .card.completed .cardTitle{text-decoration:line-through; text-decoration-thickness:1.5px; color:#35644b;}
    .card.completed .check{background:var(--green); border-color:var(--green);}
    .card.completed .check svg{display:block}
    .check svg{display:none}

    /* Modal */
    .overlay{position:fixed; inset:0; background:rgba(25,25,25,.35); display:none; align-items:center; justify-content:center; padding:18px; z-index:50;}
    .overlay.show{display:flex}
    .modal{
      width:min(430px, 100%);
      background:#fff;
      border:1px solid var(--border);
      border-radius:12px;
      box-shadow:0 12px 40px rgba(0,0,0,.18);
      overflow:hidden;
    }
    .modalHeader{
      display:flex; align-items:center; justify-content:center; gap:10px;
      padding:18px 54px 16px;
      border-bottom:1px solid var(--border);
      position:relative;
    }
    .modalHeader h2{margin:0; font-size:18px; font-weight:800; letter-spacing:.1px; text-align:center;}
    .iconBtn{
      position:absolute; right:12px; top:11px;
      width:38px; height:38px;
      border-radius:12px;
      border:0;
      background:#fff;
      font-size:22px;
      cursor:pointer;
    }
    .modalBody{padding:10px 16px 16px;}
    .detailRows{border-top:0;}
    .detailRow{
      display:grid; grid-template-columns: 1fr 1fr; align-items:center; gap:12px;
      padding:8px 0; border-bottom:1px solid var(--border);
      min-height:34px;
    }
    .detailRow label{font-size:14px; color:var(--muted);}
    .detailRow input, .detailRow select{
      width:100%; border:0; background:transparent; text-align:right; font-size:15px; color:var(--text); outline:none;
      padding:2px 0;
    }
    .detailRow input[type="number"]{appearance:textfield;}
    .detailRow input::-webkit-outer-spin-button,.detailRow input::-webkit-inner-spin-button{appearance:none; margin:0;}
    .noteWrap{padding-top:8px;}
    .noteWrap label{display:block; font-size:14px; color:var(--muted); margin-bottom:4px;}
    textarea{
      width:100%; min-height:58px; resize:vertical; border:0; outline:none;
      font-family:inherit; font-size:15px; color:var(--text); background:transparent;
    }
    .row{display:flex; gap:10px; align-items:center; justify-content:space-between; margin-top:12px; flex-wrap:wrap;}
    .toggle{
      display:flex; align-items:center; gap:10px;
      background:var(--surface);
      border:1px solid var(--border);
      padding:9px 11px;
      border-radius:12px;
      cursor:pointer;
      user-select:none;
      font-size:13px;
      font-weight:700;
    }
    .toggle .box{width:18px; height:18px; border-radius:6px; border:1px solid var(--border); background:#fff; display:flex; align-items:center; justify-content:center;}
    .toggle.checked{background:var(--greenSoft); border-color:#cfe3d7; color:#245b3d;}
    .toggle.checked .box{background:var(--green); border-color:var(--green);}
    .toggle.checked svg{display:block}
    .toggle svg{display:none}

    .modalFooter{padding:0 16px 12px; display:flex; flex-direction:column; gap:9px;}
    .doneBtn{
      width:100%; border:0; border-radius:12px; background:linear-gradient(90deg,#6B3DFF,#4422EA); color:#fff;
      height:46px; font-size:14px; font-weight:800; cursor:pointer;
    }
    .footerSmall{display:flex; justify-content:space-between; gap:10px;}
    .danger{background:#fff; border-color:#f0c6c2; color:#b42318;}

    /* Responsive */
    @media (max-width: 1260px){.grid{grid-template-columns: repeat(4, minmax(168px, 1fr));}.day{min-height:unset}}
    @media (max-width: 820px){.grid{grid-template-columns: repeat(2, minmax(168px, 1fr));}.topbar{flex-direction:column}.controls{justify-content:flex-start}}
    @media (max-width: 520px){.grid{grid-template-columns: 1fr;}.app{padding:12px}.modal{width:100%}}

    @media (prefers-color-scheme: dark){
      body{background:#191919; color:#fff;}
      :root{--border: rgba(255,255,255,.20); --surface:#202020; --surface2:#383836; --muted: rgba(255,255,255,.65); --text:#fff;}
      .card{background:#2a2a2a; border-color:#383836;}
      .card:hover{background:#202020}
      .modal,.modalHeader,.iconBtn{background:#202020}
      .detailRow input,.detailRow select,textarea{color:#fff;background:transparent;}
      .check{background:#191919}
      .addTask{background:#191919;color:#b7a8ff}
    }

    /* Hesap ve eşitleme */
    .app[hidden]{display:none}
    .account{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    .syncStatus{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
    .syncDot{width:8px;height:8px;border-radius:50%;background:#D5803B}
    .syncStatus.ok .syncDot{background:var(--green)}
    .syncStatus.error .syncDot{background:#E56458}
    .userEmail{font-size:12px;color:var(--muted);max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .authOverlay{position:fixed;inset:0;z-index:100;background:linear-gradient(145deg,#f8f7ff,#fff 55%,#eef8f3);display:flex;align-items:center;justify-content:center;padding:20px}
    .authOverlay[hidden]{display:none}
    .authCard{width:min(420px,100%);background:#fff;border:1px solid var(--border);border-radius:16px;padding:28px;box-shadow:0 20px 60px rgba(40,30,90,.12)}
    .authMark{width:44px;height:44px;border-radius:12px;background:var(--purpleSoft);display:grid;place-items:center;font-size:22px;margin-bottom:18px}
    .authCard h1{font-size:24px;margin:0 0 8px}.authCard>p{color:var(--muted);font-size:14px;line-height:1.5;margin:0 0 22px}
    .authTabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border-radius:10px;padding:4px;margin-bottom:18px}
    .authTab{border:0;background:transparent;padding:10px;border-radius:8px;font-weight:750;color:var(--muted);cursor:pointer}
    .authTab.active{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
    .authField{margin-bottom:14px}.authField label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.authField input{width:100%;height:46px;border:1px solid var(--border);border-radius:10px;padding:0 12px;font:inherit;color:var(--text);background:#fff}
    .authField input:focus{outline:3px solid rgba(91,53,245,.15);border-color:var(--purple)}
    .authSubmit{width:100%;height:46px;border:0;border-radius:10px;background:var(--purple);color:#fff;font-weight:800;cursor:pointer}
    .authSubmit:disabled{opacity:.6;cursor:wait}.authMessage{min-height:20px;font-size:13px;margin-top:12px;color:var(--muted);line-height:1.4}.authMessage.error{color:#b42318}.authMessage.success{color:#26734d}
    @media(max-width:520px){.account{justify-content:flex-start}.authCard{padding:22px}.userEmail{max-width:170px}}
    @media(prefers-color-scheme:dark){.authOverlay{background:#191919}.authCard,.authTab.active,.authField input{background:#202020}.authField input{color:#fff}}
  </style>
</head>
<body>
  <div class="authOverlay" id="authOverlay">
    <div class="authCard" role="dialog" aria-labelledby="authTitle">
      <div class="authMark" aria-hidden="true">✓</div>
      <h1 id="authTitle">Haftalık Plan</h1>
      <p>Görevlerini bilgisayarında ve telefonunda aynı hesapla kullan.</p>
      <div class="authTabs" role="tablist">
        <button class="authTab active" id="tabLogin" type="button">Giriş yap</button>
        <button class="authTab" id="tabSignup" type="button">Kayıt ol</button>
      </div>
      <form id="authForm">
        <div class="authField"><label for="authEmail">E-posta</label><input id="authEmail" type="email" autocomplete="email" required placeholder="ornek@email.com"></div>
        <div class="authField"><label for="authPassword">Şifre</label><input id="authPassword" type="password" autocomplete="current-password" minlength="6" required placeholder="En az 6 karakter"></div>
        <button class="authSubmit" id="authSubmit" type="submit">Giriş yap</button>
        <div class="authMessage" id="authMessage" aria-live="polite"></div>
      </form>
    </div>
  </div>

  <div class="app" id="app" hidden>
    <div class="topbar">
      <div class="brand">
        <h1>Haftalık Plan</h1>
        <p>Görev kutularına tıkla → detayları aç. Tamamladığında işaretle. Gün toplamı otomatik hesaplanır.</p>
      </div>
      <div class="controls">
        <button class="btn primary" id="btnAddQuick">+ Görev Ekle</button>
        <div class="account">
          <span class="syncStatus" id="syncStatus"><span class="syncDot"></span><span id="syncText">Eşitleniyor…</span></span>
          <span class="userEmail" id="userEmail"></span>
          <button class="btn" id="btnLogout" type="button">Çıkış</button>
        </div>
      </div>
    </div>

    <div class="grid" id="grid"></div>
  </div>

  <div class="overlay" id="overlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modalHeader">
        <h2 id="modalTitle">Görev</h2>
        <button class="iconBtn" id="btnClose" aria-label="Kapat">×</button>
      </div>
      <div class="modalBody">
        <div class="detailRows">
          <div class="detailRow"><label>Başlık</label><input id="fTitle" type="text" placeholder="TYT - Türkçe - Deneme" /></div>
          <div class="detailRow"><label>Durum</label><select id="fStatus"><option value="Tamamlanmadı">Tamamlanmadı</option><option value="Tamamlandı">Tamamlandı</option></select></div>
          <div class="detailRow"><label>Sınav</label><select id="fExam"><option value="TYT">TYT</option><option value="AYT">AYT</option><option value="YDT">YDT</option><option value="Diğer">Diğer</option></select></div>
          <div class="detailRow"><label>Ders</label><input id="fLesson" type="text" placeholder="Türkçe" /></div>
          <div class="detailRow"><label>Konu</label><input id="fTopic" type="text" placeholder="Genel" /></div>
          <div class="detailRow"><label>Tür</label><input id="fType" type="text" placeholder="Deneme" /></div>
          <div class="detailRow"><label>Kaynak</label><input id="fSource" type="text" placeholder="345" /></div>
          <div class="detailRow"><label>Tahmini Bitirme Süresi</label><input id="fMinutes" type="number" min="0" step="5" placeholder="50" /></div>
          <div class="detailRow"><label>Gün</label><select id="fDay"></select></div>
        </div>
        <div class="noteWrap">
          <label>Not</label>
          <textarea id="fNote" placeholder="Kısa not…"></textarea>
        </div>
        <div class="row">
          <div class="toggle" id="toggleDone" role="checkbox" aria-checked="false" tabindex="0">
            <span class="box" aria-hidden="true"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M10 3L5 9L2 6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            <span>Tamamlandı olarak işaretle</span>
          </div>
          <span style="font-size:12px; color:var(--muted)" id="metaId"></span>
        </div>
      </div>
      <div class="modalFooter">
        <button class="doneBtn" id="btnSave">Tamam</button>
        <div class="footerSmall">
          <button class="btn danger" id="btnDelete">Sil</button>
          <button class="btn" id="btnCancel">Vazgeç</button>
        </div>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
  const SUPABASE_URL = "https://rmgcwysdexhxqmxtlals.supabase.co";
  const SUPABASE_KEY = "sb_publishable_pOoQwJUTu-C8xYXFF-Jt7A_ioujGCSq";
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const DOW_TR = ["Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi","Pazar"];
  const $ = id => document.getElementById(id);
  const grid=$("grid"), overlay=$("overlay"), app=$("app"), authOverlay=$("authOverlay");
  const btnClose=$("btnClose"), btnCancel=$("btnCancel"), btnSave=$("btnSave"), btnDelete=$("btnDelete"), btnAddQuick=$("btnAddQuick");
  const fTitle=$("fTitle"), fStatus=$("fStatus"), fExam=$("fExam"), fLesson=$("fLesson"), fTopic=$("fTopic"), fType=$("fType"), fSource=$("fSource"), fMinutes=$("fMinutes"), fDay=$("fDay"), fNote=$("fNote"), toggleDone=$("toggleDone"), metaId=$("metaId");
  const STORAGE_KEY="weeklyPlanner_v3";
  let currentUser=null, tasks=[], modalDraft=null, authMode="login", realtimeChannel=null;

  function uid(){ return crypto.randomUUID ? crypto.randomUUID() : "t_"+Math.random().toString(16).slice(2)+"_"+Date.now().toString(16); }
  function minutesToHm(min){ const m=Math.max(0,Number(min)||0),h=Math.floor(m/60),r=m%60; return h>0?`${h} saat ${r} dk`:`${r} dk`; }
  function setSync(text,type=""){ $("syncText").textContent=text; $("syncStatus").className="syncStatus "+type; }
  function showError(error){ console.error(error); setSync("Eşitleme hatası","error"); alert("İşlem tamamlanamadı: "+(error?.message||error)); }
  function toRow(t){ return {id:String(t.id),user_id:currentUser.id,title:t.title||"",status:t.completed?"Tamamlandı":"Tamamlanmadı",exam:t.exam||"TYT",lesson:t.lesson||"",topic:t.topic||"",type:t.type||"",source:t.source||"",minutes:Number(t.minutes)||0,note:t.note||"",day_index:Number(t.dayIndex)||0,completed:!!t.completed,created_at:t.createdAt?new Date(t.createdAt).toISOString():new Date().toISOString(),updated_at:new Date().toISOString()}; }
  function fromRow(r){ return {id:r.id,title:r.title,status:r.status,exam:r.exam,lesson:r.lesson,topic:r.topic,type:r.type,source:r.source,minutes:r.minutes,note:r.note,dayIndex:r.day_index,completed:r.completed,createdAt:new Date(r.created_at).getTime()}; }

  async function loadTasks(){
    if(!currentUser) return;
    setSync("Eşitleniyor…");
    const {data,error}=await db.from("tasks").select("*").order("created_at",{ascending:false});
    if(error){ showError(error); return; }
    tasks=(data||[]).map(fromRow); render(); setSync("Eşitlendi","ok");
  }
  async function migrateLocalTasks(){
    const migrationKey=`weeklyPlanner_migrated_${currentUser.id}`;
    if(localStorage.getItem(migrationKey)) return;
    let local=[]; try{ local=(JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}")?.tasks)||[]; }catch{}
    if(local.length){
      const {error}=await db.from("tasks").upsert(local.map(toRow),{onConflict:"id"});
      if(error) throw error;
    }
    localStorage.setItem(migrationKey,"1");
  }
  async function upsertTask(task){ setSync("Kaydediliyor…"); const {error}=await db.from("tasks").upsert(toRow(task)); if(error) throw error; await loadTasks(); }
  async function deleteTask(id){ setSync("Siliniyor…"); const {error}=await db.from("tasks").delete().eq("id",id); if(error) throw error; tasks=tasks.filter(t=>t.id!==id); render(); setSync("Eşitlendi","ok"); }
  async function toggleTaskComplete(id){ const task=tasks.find(t=>t.id===id); if(!task)return; task.completed=!task.completed;task.status=task.completed?"Tamamlandı":"Tamamlanmadı";render();try{await upsertTask(task)}catch(e){showError(e);await loadTasks()} }

  function computeDayTotals(list){const totals=Array(7).fill(0);list.forEach(t=>{const i=Number(t.dayIndex);if(i>=0&&i<7)totals[i]+=Number(t.minutes)||0});return totals}
  function render(){
    fDay.innerHTML=""; for(let i=0;i<7;i++){const o=document.createElement("option");o.value=String(i);o.textContent=DOW_TR[i];fDay.appendChild(o)}
    const totals=computeDayTotals(tasks);grid.innerHTML="";
    for(let i=0;i<7;i++){
      const col=document.createElement("div");col.className="day";col.dataset.dayIndex=String(i);
      const header=document.createElement("div");header.className="dayHeader";header.innerHTML=`<div class="dow">${DOW_TR[i]}</div><div class="totals">Toplam süre: ${minutesToHm(totals[i])}</div>`;col.appendChild(header);
      const add=document.createElement("button");add.className="addTask";add.type="button";add.innerHTML='<span style="font-size:16px;line-height:0">+</span> Görev Ekle';add.onclick=()=>openModal({dayIndex:i});col.appendChild(add);
      const cards=document.createElement("div");cards.className="cards";
      tasks.filter(t=>Number(t.dayIndex)===i).forEach(t=>{
        const card=document.createElement("div");card.className="card"+(t.completed?" completed":"");card.tabIndex=0;card.role="button";card.setAttribute("aria-label",t.title||"Görev");card.onclick=()=>openModal(t);card.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openModal(t)}};
        const check=document.createElement("button");check.className="check";check.type="button";check.title=t.completed?"Tamamlanmadı olarak işaretle":"Tamamlandı olarak işaretle";check.setAttribute("aria-label",check.title);check.innerHTML='<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M10 3L5 9L2 6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';check.onclick=e=>{e.stopPropagation();toggleTaskComplete(t.id)};
        const title=document.createElement("div");title.className="cardTitle";title.textContent=t.title||"(Başlıksız)";const meta=document.createElement("div");meta.className="cardMeta";meta.textContent=t.topic||"Genel";const mins=document.createElement("div");mins.className="cardMinutes";mins.textContent=`${Number(t.minutes)||0} dk`;const kebab=document.createElement("button");kebab.className="kebab";kebab.type="button";kebab.title="Düzenle";kebab.textContent="⋯";kebab.onclick=e=>{e.stopPropagation();openModal(t)};card.append(check,title,meta,mins,kebab);cards.appendChild(card)
      });col.appendChild(cards);grid.appendChild(col)
    }
  }
  function openModal(v={}){const existing=v.id?tasks.find(t=>t.id===v.id):null;const t=existing?structuredClone(existing):{id:uid(),title:"",status:"Tamamlanmadı",exam:"TYT",lesson:"",topic:"",type:"",source:"",minutes:0,note:"",dayIndex:Number(v.dayIndex??0),completed:false,createdAt:Date.now()};modalDraft=t;$("modalTitle").textContent=existing?(t.title||"Görev"):"Yeni Görev";fTitle.value=t.title||"";fStatus.value=t.completed?"Tamamlandı":(t.status||"Tamamlanmadı");fExam.value=t.exam||"TYT";fLesson.value=t.lesson||"";fTopic.value=t.topic||"";fType.value=t.type||"";fSource.value=t.source||"";fMinutes.value=String(Number(t.minutes)||0);fDay.value=String(Number(t.dayIndex)||0);fNote.value=t.note||"";setDoneUI(!!t.completed);metaId.textContent=existing?`${Number(t.minutes)||0} dk`:"";btnDelete.style.display=existing?"inline-flex":"none";overlay.classList.add("show");overlay.setAttribute("aria-hidden","false");fTitle.focus()}
  function setDoneUI(done){toggleDone.classList.toggle("checked",done);toggleDone.setAttribute("aria-checked",done?"true":"false");fStatus.value=done?"Tamamlandı":"Tamamlanmadı"}
  function closeModal(){overlay.classList.remove("show");overlay.setAttribute("aria-hidden","true");modalDraft=null}
  function syncDraft(){if(!modalDraft)return;modalDraft.title=fTitle.value.trim();modalDraft.exam=fExam.value;modalDraft.lesson=fLesson.value.trim();modalDraft.topic=fTopic.value.trim();modalDraft.type=fType.value.trim();modalDraft.source=fSource.value.trim();modalDraft.minutes=Math.max(0,Number(fMinutes.value||0));modalDraft.note=fNote.value;modalDraft.dayIndex=Number(fDay.value||0);const done=fStatus.value==="Tamamlandı";modalDraft.completed=done;modalDraft.status=done?"Tamamlandı":"Tamamlanmadı";setDoneUI(done)}

  function setAuthMode(mode){authMode=mode;$("tabLogin").classList.toggle("active",mode==="login");$("tabSignup").classList.toggle("active",mode==="signup");$("authSubmit").textContent=mode==="login"?"Giriş yap":"Hesap oluştur";$("authPassword").autocomplete=mode==="login"?"current-password":"new-password";$("authMessage").textContent=""}
  async function enterApp(user){currentUser=user;authOverlay.hidden=true;app.hidden=false;$("userEmail").textContent=user.email||"";try{await migrateLocalTasks();await loadTasks();subscribeRealtime()}catch(e){showError(e)}}
  function leaveApp(){currentUser=null;tasks=[];app.hidden=true;authOverlay.hidden=false;if(realtimeChannel){db.removeChannel(realtimeChannel);realtimeChannel=null}}
  function subscribeRealtime(){if(realtimeChannel)db.removeChannel(realtimeChannel);realtimeChannel=db.channel(`tasks-${currentUser.id}`).on("postgres_changes",{event:"*",schema:"public",table:"tasks",filter:`user_id=eq.${currentUser.id}`},()=>loadTasks()).subscribe()}

  $("tabLogin").onclick=()=>setAuthMode("login");$("tabSignup").onclick=()=>setAuthMode("signup");
  $("authForm").onsubmit=async e=>{e.preventDefault();const email=$("authEmail").value.trim(),password=$("authPassword").value,msg=$("authMessage"),submit=$("authSubmit");submit.disabled=true;msg.className="authMessage";msg.textContent="Lütfen bekle…";const result=authMode==="login"?await db.auth.signInWithPassword({email,password}):await db.auth.signUp({email,password});submit.disabled=false;if(result.error){msg.className="authMessage error";msg.textContent=result.error.message;return}if(authMode==="signup"&&!result.data.session){msg.className="authMessage success";msg.textContent="Hesabın oluşturuldu. E-postandaki onay bağlantısına tıkla, sonra giriş yap.";setAuthMode("login");return}if(result.data.user)await enterApp(result.data.user)};
  $("btnLogout").onclick=async()=>{await db.auth.signOut();leaveApp()};btnAddQuick.onclick=()=>openModal({dayIndex:0});btnClose.onclick=()=>closeModal();btnCancel.onclick=()=>closeModal();
  [fTitle,fStatus,fExam,fLesson,fTopic,fType,fSource,fMinutes,fDay,fNote].forEach(el=>{el.addEventListener("input",syncDraft);el.addEventListener("change",syncDraft)});
  toggleDone.onclick=()=>{const done=toggleDone.getAttribute("aria-checked")==="true";setDoneUI(!done);if(modalDraft){modalDraft.completed=!done;modalDraft.status=!done?"Tamamlandı":"Tamamlanmadı"}};toggleDone.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();toggleDone.click()}};
  btnSave.onclick=async()=>{if(!modalDraft)return;if(!modalDraft.title)modalDraft.title="(Başlıksız)";btnSave.disabled=true;try{await upsertTask(modalDraft);closeModal()}catch(e){showError(e)}finally{btnSave.disabled=false}};
  btnDelete.onclick=async()=>{if(modalDraft&&confirm("Bu görevi silmek istiyor musun?")){try{await deleteTask(modalDraft.id);closeModal()}catch(e){showError(e)}}};overlay.onclick=e=>{if(e.target===overlay)closeModal()};document.onkeydown=e=>{if(e.key==="Escape"&&overlay.classList.contains("show"))closeModal()};document.addEventListener("visibilitychange",()=>{if(!document.hidden&&currentUser)loadTasks()});
  db.auth.getSession().then(({data})=>data.session?.user?enterApp(data.session.user):leaveApp());
})();
</script>
</body>
</html>
